name: Release

# Opens a "Version Packages" pull request from pending changesets. Merging it
# publishes to npm with provenance. Nothing publishes until the repository has
# an NPM_TOKEN secret (first publish) or trusted publishers configured on npm.
# Setup steps: docs/releasing.md
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # First publish: an automation token in the NPM_TOKEN secret.
          # Afterwards: trusted publishing (OIDC) needs no token; remove the secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
