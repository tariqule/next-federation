name: Labeler

# Labels pull requests by the paths they change (see .github/labeler.yml).
# `pull_request_target` runs with write access, so this workflow never checks out or runs the pull
# request's code: actions/labeler reads the config from the base branch and the changed file list
# from the API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
