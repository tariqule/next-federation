name: Publish to npm

# Manual only: Actions -> "Publish to npm" -> Run workflow (on main).
# Publishes every @next-federation/* package whose version is not on npm yet,
# with provenance, pushes the release tags and creates the GitHub Release
# v<version> (all packages share one version). Merge the "Version Packages"
# pull request first. The job runs in the `npm-publish` environment: add
# required reviewers there to get an approval step before anything publishes.
# First publish: an NPM_TOKEN secret (environment or repository). Afterwards:
# trusted publishing (OIDC, workflow file publish.yml) needs no token.
# Steps: docs/releasing.md
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and pack, publish nothing'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Refuse to publish with pending changesets
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$pending" -ne 0 ]; then
            echo "::error::$pending pending changeset(s): merge the Version Packages pull request first."
            exit 1
          fi
      - name: Versions to publish
        run: |
          for p in packages/*/package.json; do
            node -e "const p=require('./$p'); console.log(p.name + '@' + p.version)"
          done
      # The packages must all have one version, and a changelog must have its
      # section, or this fails before anything is published.
      - name: Release version and notes
        id: release
        run: |
          version=$(node scripts/release-notes.mjs --version)
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/release-notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Dry run (build, pack, publish nothing)
        if: inputs.dry_run
        run: |
          pnpm build
          pnpm check:pack
          pnpm -r --filter "./packages/*" publish --dry-run --no-git-checks
      - name: Dry run, GitHub Release that would be created
        if: inputs.dry_run
        run: |
          echo "Would create GitHub Release v$RELEASE_VERSION at $GITHUB_SHA (latest) with these notes:"
          echo "----------------------------------------"
          cat "$RUNNER_TEMP/release-notes.md"
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
      # `pnpm release`; when npm holds a version as staged (E409 "Cannot
      # publish over previously staged version"), waits up to 15 min until npm
      # shows it and, if its provenance names this commit, publishes the rest.
      # Any other failure fails the job (docs/releasing.md).
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: node scripts/publish-wait.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Push release tags
        if: ${{ !inputs.dry_run }}
        run: git push origin --tags
      # One release for the whole version, at the published commit. The tag
      # v<version> is created by `gh release create` (the "release tags"
      # ruleset allows creating v* tags). A re-run leaves an existing release
      # alone, so notes edited by hand are kept.
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::Release $tag already exists; leaving it unchanged."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
