name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Old-React island remote (outside the workspace)
        # The React sharing e2e's remote `c` pins an older React (19.2.9),
        # so it has its own install (pnpm-workspace.yaml excludes it).
        run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: test/fixtures/island-remote-old-react
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:docs
      - run: pnpm guardrail
      # Build first: package imports resolve to each package's dist types.
      - run: pnpm build
      - run: pnpm typecheck
      - name: Error docs
        if: hashFiles('scripts/check-error-docs.mjs') != ''
        run: pnpm check:error-docs
      - name: Pack check
        run: pnpm check:pack
      - run: pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: packages/*/dist
          if-no-files-found: ignore

  node-floor:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.9
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: packages
      - name: Production install of runtime dependencies
        # Runtime deps only (no dev tooling), resolved by pnpm so workspace:*
        # links work. Runs on the Node floor.
        run: pnpm install --frozen-lockfile --prod --ignore-scripts --filter "./packages/*"
      - name: Peer dependencies, as the host app provides them
        # react and react-dom are peers, so a production install leaves them out.
        run: |
          V=$(node -p "require('./packages/react/package.json').devDependencies.react")
          mkdir -p "$RUNNER_TEMP/peers"
          (cd "$RUNNER_TEMP/peers" && npm init -y > /dev/null && npm install --no-audit --no-fund "react@$V" "react-dom@$V")
          for p in react react-dom scheduler; do
            rm -rf "node_modules/$p"
            ln -s "$RUNNER_TEMP/peers/node_modules/$p" "node_modules/$p"
          done
      - run: node scripts/smoke-dist.mjs

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # installed, installed:webpack: next-federation from packed tarballs
        # in a real node_modules, `next dev` on Next 15 and 16, with and
        # without source maps (installed-dev.spec.ts). They set NF_MIN_PASSED=4
        # (test/e2e/run.ts), one per installed host: a run where any test
        # skipped fails.
        cell:
          [
            dev,
            'dev:webpack',
            prod,
            'prod:webpack',
            skew,
            installed,
            'installed:webpack',
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Old-React island remote (outside the workspace)
        run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: test/fixtures/island-remote-old-react
      - run: pnpm build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm e2e:${{ matrix.cell }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-${{ strategy.job-index }}
          path: |
            test/e2e/test-results*
            test/e2e/.logs*
          if-no-files-found: ignore

  e2e-measure:
    # Size budgets: the unshared control run must come first (it writes the
    # control file the shared run compares against).
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: test/fixtures/island-remote-old-react
      - run: pnpm build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Unshared control
        run: pnpm e2e:prod -- sharing measure
        env:
          NF_MEASURE: '1'
          NF_SHARE: '0'
      - name: Shared (asserts budgets)
        run: pnpm e2e:prod -- sharing measure
        env:
          NF_MEASURE: '1'

  e2e-browsers:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: test/fixtures/island-remote-old-react
      - run: pnpm build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e:browsers

  examples-smoke:
    # Builds every example in examples/, serves them on ports 3300-3304 and
    # checks the remote's /_nf/health and the host pages' island HTML.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Link nf-serve (its bin target exists only after the build)
        run: pnpm install --frozen-lockfile --offline
      - run: pnpm examples:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: examples-logs
          path: examples/.logs
          if-no-files-found: ignore
