name: Vercel

# Manual only: deploys the island-remote fixture to a Vercel project twice
# (two production deployments) and runs test/e2e/vercel.spec.ts against it.
# Guide: docs/guides/deploying-a-remote-on-vercel.md.
on:
  workflow_dispatch:
    inputs:
      production-domain:
        description: The project's production domain, without https://
        required: true
        default: next-federation-island-remote.vercel.app

concurrency:
  group: vercel-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The CLI reads all three from the environment (no `vercel link`).
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DOMAIN: ${{ inputs.production-domain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install --global vercel@65.16.0
      - name: Two production deployments
        working-directory: test/fixtures/island-remote
        run: |
          set -euo pipefail
          deploy() {
            # `vercel build` does not set VERCEL_PROJECT_PRODUCTION_URL, so
            # the fixture's base comes from the input.
            NF_BUILD_ID="$1" VERCEL_PROJECT_PRODUCTION_URL="$DOMAIN" \
              vercel build --prod --yes
            vercel deploy --prebuilt --prod --yes --json > "$RUNNER_TEMP/$1.json"
          }
          old="v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          deploy "$old"
          deploy "v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "NF_VERCEL_PROD_URL=https://$DOMAIN"
            echo "NF_VERCEL_OLD_BUILD_ID=$old"
            echo "NF_VERCEL_OLD_DEPLOYMENT_ID=$(jq -r .deployment.id "$RUNNER_TEMP/$old.json")"
            echo "NF_VERCEL_OLD_DEPLOYMENT_URL=$(jq -r .deployment.url "$RUNNER_TEMP/$old.json")"
          } >> "$GITHUB_ENV"
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: e2e (host-app against the Vercel remote)
        run: pnpm --filter e2e exec playwright test vercel
        env:
          NF_MODE: prod
          NF_APPS: host-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: vercel-e2e
          path: |
            test/e2e/test-results
            test/e2e/.logs
          if-no-files-found: ignore
