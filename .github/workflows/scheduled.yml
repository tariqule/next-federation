name: Scheduled compatibility

# Non-blocking early warnings: newer Next.js and a newer @vitejs/plugin-rsc.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fixtures on next@canary
        run: |
          for f in host-app host-pages; do
            pnpm --filter "./test/fixtures/$f" add next@canary
          done
      - run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: test/fixtures/island-remote-old-react
      - run: pnpm build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm e2e:prod
      # Still non-blocking: a failure opens (or comments on) one open issue
      # labelled `compat` per job, with the run link.
      - name: Report the failure in a compat issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Scheduled compatibility: next-canary failed'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create compat --color FBCA04 --description 'Scheduled compatibility failures' 2>/dev/null || true
          body="The scheduled \`next-canary\` job failed: $RUN_URL"
          number=$(gh issue list --state open --label compat --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label compat --body "$body"
          fi

  plugin-rsc-next:
    # Installs the newest @vitejs/plugin-rsc. Without NF_ALLOW_PLUGIN_RSC the
    # build must fail with NF-025 (the pin guard works); with it, the suite
    # tells maintainers whether the new release can be adopted.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @next-federation/vite add @vitejs/plugin-rsc@latest
      - run: pnpm build
      - name: Pin guard reports NF-025
        run: |
          if pnpm --filter island-remote build 2>&1 | tee build.log; then
            grep -q "NF-025" build.log || { echo "expected NF-025 or the pin is already latest"; }
          else
            grep -q "NF-025" build.log
          fi
      - run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: test/fixtures/island-remote-old-react
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm e2e:prod
        env:
          NF_ALLOW_PLUGIN_RSC: '1'
      # Still non-blocking: a failure opens (or comments on) one open issue
      # labelled `compat` per job, with the run link.
      - name: Report the failure in a compat issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Scheduled compatibility: plugin-rsc-next failed'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create compat --color FBCA04 --description 'Scheduled compatibility failures' 2>/dev/null || true
          body="The scheduled \`plugin-rsc-next\` job failed: $RUN_URL"
          number=$(gh issue list --state open --label compat --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label compat --body "$body"
          fi
