version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Deliberately pinned, with version checks in the build.
      - dependency-name: '@vitejs/plugin-rsc'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@module-federation/vite'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
